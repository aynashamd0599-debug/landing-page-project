<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة الهبوط - تصميم مواقع الإنترنت</title>
    <style>
        /* تنسيقات عامة لتوسيط المحتوى وخلفية الصفحة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* حاوية محتوى صفحة الهبوط */
        .landing-container {
            text-align: center;
            max-width: 900px;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            color: #e0e0e0;
        }

        /* تنسيق حاوية الصورة لضمان ظهورها بشكل جميل ومتجاوب */
        .image-wrapper {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            background-color: #000;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- بداية حاوية صفحة الهبوط الرئيسية -->
    <div class="landing-container">
        <h1>مرحباً بكم في صفحة الهبوط</h1>
        
        <!-- قسم عرض الصورة المطلوبة للتصميم -->
        <div class="image-wrapper">
            <!-- استدعاء صورة الجبال الثلجية -->
            <img src="landing.jpg" alt="صورة الجبال الثلجية">
        </div>
    </div>
    <!-- نهاية حاوية صفحة الهبوط -->

</body>
</html>
